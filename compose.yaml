name: tender-intelligence

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tender_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-tender}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tender}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-local}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      APP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tender}:${POSTGRES_PASSWORD:-tender}@postgres:5432/${POSTGRES_DB:-tender_intelligence}
      APP_DATABASE_ECHO: ${APP_DATABASE_ECHO:-false}
      APP_DATABASE_POOL_SIZE: ${APP_DATABASE_POOL_SIZE:-5}
      APP_DATABASE_POOL_TIMEOUT: ${APP_DATABASE_POOL_TIMEOUT:-30}
      APP_DATABASE_CONNECT_TIMEOUT: ${APP_DATABASE_CONNECT_TIMEOUT:-5}
      APP_STORAGE_PATH: /data/uploads
      APP_UPLOAD_MAX_SIZE_MB: ${APP_UPLOAD_MAX_SIZE_MB:-25}
      APP_UPLOAD_CHUNK_SIZE_BYTES: ${APP_UPLOAD_CHUNK_SIZE_BYTES:-1048576}
      APP_TEXT_CHUNK_SIZE_CHARS: ${APP_TEXT_CHUNK_SIZE_CHARS:-1200}
      APP_TEXT_CHUNK_OVERLAP_CHARS: ${APP_TEXT_CHUNK_OVERLAP_CHARS:-200}
      APP_ANALYSIS_CONTEXT_MAX_CHUNKS: ${APP_ANALYSIS_CONTEXT_MAX_CHUNKS:-12}
      APP_ANALYSIS_CONTEXT_MAX_CHARS: ${APP_ANALYSIS_CONTEXT_MAX_CHARS:-16000}
      APP_LLM_PROVIDER: ${APP_LLM_PROVIDER:-openai}
      APP_LLM_BASE_URL: ${APP_LLM_BASE_URL:-https://api.openai.com/v1}
      APP_LLM_API_KEY: ${APP_LLM_API_KEY:-}
      APP_LLM_MODEL: ${APP_LLM_MODEL:-gpt-4o-mini}
      APP_LLM_TIMEOUT_SECONDS: ${APP_LLM_TIMEOUT_SECONDS:-60}
      APP_EMBEDDING_MODEL: ${APP_EMBEDDING_MODEL:-text-embedding-3-small}
      APP_EMBEDDING_BATCH_SIZE: ${APP_EMBEDDING_BATCH_SIZE:-32}
      APP_RAG_TOP_K: ${APP_RAG_TOP_K:-5}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    ports:
      - "${APP_HTTP_PORT:-8000}:8000"
    volumes:
      - document_storage:/data/uploads
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  postgres_data:
  document_storage:
